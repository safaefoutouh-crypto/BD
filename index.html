<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday ✦</title>

<style>
/* =========================================================
   CUSTOMIZE THESE
   ========================================================= */

:root {
    --bg-1: #070b14;
    --bg-2: #101827;
    --bg-3: #172238;

    --accent: #8db8ff;
    --accent-light: #dceaff;
    --accent-dark: #426da8;

    --cake-main: #314766;
    --cake-light: #526d91;
    --cake-cream: #e8edf5;

    --text: #f4f7fb;
    --muted: #9da9bb;

    --glass: rgba(255,255,255,0.07);
    --glass-border: rgba(255,255,255,0.12);
}

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 50% 30%, #182942 0%, transparent 35%),
        radial-gradient(circle at 20% 80%, #111c30 0%, transparent 30%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2), var(--bg-3));

    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================================================
   BACKGROUND
   ========================================================= */

#stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.5;
    animation: twinkle infinite alternate;
}

@keyframes twinkle {
    from {
        opacity: 0.15;
        transform: scale(0.7);
    }

    to {
        opacity: 0.9;
        transform: scale(1.4);
    }
}

/* =========================================================
   MAIN CARD
   ========================================================= */

.app {
    position: relative;
    z-index: 2;

    width: min(92vw, 850px);
    min-height: 650px;

    padding: 55px 30px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    background: rgba(7, 12, 22, 0.65);

    border: 1px solid var(--glass-border);
    border-radius: 30px;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 30px 100px rgba(0,0,0,0.5),
        inset 0 1px rgba(255,255,255,0.06);

    animation: appear 1.2s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(30px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* =========================================================
   INTRO
   ========================================================= */

.eyebrow {
    color: var(--accent);
    font-size: 0.8rem;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 15px;
}

h1 {
    font-size: clamp(2.3rem, 7vw, 4.5rem);
    font-weight: normal;
    letter-spacing: -1px;
    margin-bottom: 12px;

    background:
        linear-gradient(
            120deg,
            white,
            var(--accent-light),
            white
        );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    background-size: 200%;
    animation: shine 5s linear infinite;
}

@keyframes shine {
    from {
        background-position: 200%;
    }

    to {
        background-position: -200%;
    }
}

.subtitle {
    color: var(--muted);
    font-family: Arial, sans-serif;
    font-size: 0.95rem;
    letter-spacing: 1px;
}

/* =========================================================
   CAKE AREA
   ========================================================= */

.cake-wrapper {
    position: relative;
    width: 330px;
    height: 330px;
    margin: 35px auto 15px;
}

/* glow beneath cake */

.cake-glow {
    position: absolute;

    width: 300px;
    height: 100px;

    left: 15px;
    bottom: 10px;

    background: var(--accent);
    opacity: 0.12;

    filter: blur(40px);
    border-radius: 50%;
}

/* =========================================================
   CAKE
   ========================================================= */

.cake {
    position: absolute;

    width: 270px;
    height: 190px;

    left: 30px;
    bottom: 30px;
}

/* bottom layer */

.layer {
    position: absolute;

    width: 100%;
    height: 70px;

    left: 0;

    background:
        linear-gradient(
            90deg,
            #243650,
            var(--cake-main),
            #253752
        );

    border-radius: 13px;

    box-shadow:
        inset 0 -10px rgba(0,0,0,0.15),
        0 12px 25px rgba(0,0,0,0.35);
}

.layer.bottom {
    bottom: 0;
}

.layer.middle {
    width: 235px;
    left: 17.5px;
    bottom: 52px;
}

.layer.top {
    width: 195px;
    left: 37.5px;
    bottom: 104px;
}

/* =========================================================
   FROSTING
   ========================================================= */

.frosting {
    position: absolute;

    width: 195px;
    height: 30px;

    left: 37.5px;
    bottom: 151px;

    background: var(--cake-cream);

    border-radius: 20px 20px 12px 12px;

    box-shadow:
        0 5px 10px rgba(0,0,0,0.15);
}

.drip {
    position: absolute;

    width: 18px;
    height: 25px;

    background: var(--cake-cream);

    border-radius: 0 0 15px 15px;
}

.drip:nth-child(1) {
    left: 20px;
    top: 15px;
}

.drip:nth-child(2) {
    left: 75px;
    top: 13px;
}

.drip:nth-child(3) {
    right: 25px;
    top: 16px;
}

/* =========================================================
   DECORATIONS
   ========================================================= */

.decoration {
    position: absolute;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
}

.d1 { left: 35px; bottom: 25px; }
.d2 { left: 85px; bottom: 28px; }
.d3 { left: 140px; bottom: 22px; }
.d4 { right: 45px; bottom: 30px; }
.d5 { right: 85px; bottom: 20px; }

/* =========================================================
   CANDLE
   ========================================================= */

.candle {
    position: absolute;

    width: 20px;
    height: 72px;

    left: 125px;
    bottom: 158px;

    border-radius: 5px;

    background:
        repeating-linear-gradient(
            -45deg,
            var(--accent-light) 0,
            var(--accent-light) 9px,
            var(--accent) 9px,
            var(--accent) 15px
        );

    box-shadow:
        0 5px 15px rgba(0,0,0,0.2);
}

.wick {
    position: absolute;

    width: 3px;
    height: 10px;

    background: #171717;

    top: -9px;
    left: 8.5px;

    border-radius: 3px;
}

/* =========================================================
   FLAME
   ========================================================= */

.flame {
    position: absolute;

    width: 25px;
    height: 35px;

    left: 122px;
    bottom: 228px;

    background:
        radial-gradient(
            circle at 50% 70%,
            #fff7b0 0 20%,
            #ffd15c 35%,
            #ff8a35 65%,
            transparent 70%
        );

    border-radius: 50% 50% 50% 0;

    transform: rotate(-45deg);

    filter:
        drop-shadow(0 0 10px #ffb13b)
        drop-shadow(0 0 20px #ff8a35);

    animation: flame 0.18s infinite alternate;

    cursor: pointer;

    transition: 0.5s;
}

@keyframes flame {
    from {
        transform:
            rotate(-45deg)
            scale(0.95)
            translateY(2px);
    }

    to {
        transform:
            rotate(-43deg)
            scale(1.1)
            translateY(-2px);
    }
}

.flame.off {
    opacity: 0;
    transform: scale(0);
    pointer-events: none;
}

/* smoke */

.smoke {
    position: absolute;

    left: 131px;
    bottom: 236px;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: rgba(220,230,240,0.2);

    filter: blur(5px);

    opacity: 0;

    pointer-events: none;
}

.smoke.active {
    animation: smoke 2.5s ease-out forwards;
}

@keyframes smoke {
    0% {
        opacity: 0.5;
        transform: translateY(0) scale(0.7);
    }

    100% {
        opacity: 0;
        transform:
            translateY(-70px)
            translateX(15px)
            scale(2.5);
    }
}

/* =========================================================
   CONTROLS
   ========================================================= */

.controls {
    display: flex;
    gap: 12px;

    flex-wrap: wrap;
    justify-content: center;

    margin-top: 15px;
}

button {
    border: 1px solid var(--glass-border);

    background: var(--glass);

    color: var(--text);

    padding: 12px 20px;

    border-radius: 999px;

    font-family: Arial, sans-serif;
    font-size: 0.85rem;

    cursor: pointer;

    transition:
        transform 0.25s,
        background 0.25s,
        border-color 0.25s;
}

button:hover {
    transform: translateY(-2px);

    background: rgba(255,255,255,0.12);

    border-color: rgba(255,255,255,0.25);
}

button.primary {
    background: var(--accent-dark);
    border-color: var(--accent);
}

/* =========================================================
   BLOW INSTRUCTION
   ========================================================= */

.instruction {
    margin-top: 18px;

    color: var(--muted);

    font-family: Arial, sans-serif;

    font-size: 0.78rem;

    opacity: 0.8;
}

/* =========================================================
   MESSAGE
   ========================================================= */

.message-box {
    max-width: 560px;

    margin-top: 25px;

    padding: 0 15px;

    min-height: 80px;

    opacity: 0;

    transform: translateY(15px);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.message-box.show {
    opacity: 1;
    transform: translateY(0);
}

.message {
    color: #e7edf7;

    font-size: 1.05rem;

    line-height: 1.8;

    white-space: pre-line;
}

.cursor {
    display: inline-block;

    width: 2px;
    height: 18px;

    background: var(--accent);

    margin-left: 3px;

    animation: blink 0.8s infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}

/* =========================================================
   MUSIC PLAYER
   ========================================================= */

.music-player {
    position: fixed;

    right: 20px;
    bottom: 20px;

    z-index: 20;

    width: 210px;

    padding: 14px;

    background: rgba(10,15,25,0.8);

    border: 1px solid var(--glass-border);

    border-radius: 18px;

    backdrop-filter: blur(15px);

    opacity: 0;

    transform: translateY(20px);

    pointer-events: none;

    transition: 0.5s;
}

.music-player.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

.music-title {
    font-family: Arial, sans-serif;

    font-size: 0.75rem;

    color: var(--muted);

    margin-bottom: 8px;
}

.music-progress {
    width: 100%;
    height: 3px;

    background: rgba(255,255,255,0.1);

    border-radius: 10px;

    overflow: hidden;
}

.music-progress-bar {
    height: 100%;

    width: 0%;

    background: var(--accent);

    transition: width 0.2s linear;
}

/* =========================================================
   CONFETTI
   ========================================================= */

.confetti {
    position: fixed;

    top: -20px;

    width: 8px;
    height: 14px;

    z-index: 50;

    pointer-events: none;

    animation:
        confetti-fall
        var(--duration)
        linear forwards;
}

@keyframes confetti-fall {
    to {
        transform:
            translate3d(
                var(--x),
                110vh,
                0
            )
            rotate(
                var(--rotation)
            );

        opacity: 0;
    }
}

/* =========================================================
   HEARTS
   ========================================================= */

.heart {
    position: fixed;

    bottom: -20px;

    z-index: 5;

    color: var(--accent);

    pointer-events: none;

    animation:
        float-heart
        var(--duration)
        ease-out forwards;
}

@keyframes float-heart {
    0% {
        opacity: 0;
        transform:
            translateY(0)
            scale(0.5);
    }

    20% {
        opacity: 0.7;
    }

    100% {
        opacity: 0;
        transform:
            translateY(-100vh)
            translateX(var(--drift))
            rotate(20deg)
            scale(1.2);
    }
}

/* =========================================================
   FINAL MESSAGE
   ========================================================= */

.final {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(3,7,14,0.94);

    backdrop-filter: blur(12px);

    opacity: 0;

    pointer-events: none;

    transition: opacity 1s ease;

    padding: 30px;
}

.final.visible {
    opacity: 1;
    pointer-events: auto;
}

.final-card {
    max-width: 650px;

    text-align: center;

    animation: finalAppear 1.2s ease;
}

@keyframes finalAppear {
    from {
        transform: scale(0.9) translateY(20px);
        opacity: 0;
    }

    to {
        transform: scale(1) translateY(0);
        opacity: 1;
    }
}

.final-symbol {
    font-size: 2rem;

    color: var(--accent);

    margin-bottom: 20px;
}

.final h2 {
    font-size: clamp(2rem, 6vw, 4rem);

    font-weight: normal;

    margin-bottom: 25px;
}

.final p {
    color: #cbd5e4;

    font-size: 1.1rem;

    line-height: 1.9;
}

.close-final {
    margin-top: 35px;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .app {
        min-height: 100vh;

        width: 100vw;

        border-radius: 0;

        border-left: none;
        border-right: none;

        padding: 40px 15px;
    }

    .cake-wrapper {
        transform: scale(0.82);

        margin-top: 15px;
        margin-bottom: -15px;
    }

    .music-player {
        right: 10px;
        bottom: 10px;
        width: 190px;
    }

    .instruction {
        max-width: 280px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     BACKGROUND
     ===================================================== -->

<div id="stars"></div>


<!-- =====================================================
     MAIN
     ===================================================== -->

<main class="app">

    <div class="eyebrow">
        A little something for you
    </div>

    <!-- CHANGE HIS NAME HERE -->

    <h1 id="title">
        ✦Happy Birthday! ✦
    </h1>

    <p class="subtitle">
        Make a wish.
    </p>


    <!-- =================================================
         CAKE
         ================================================= -->

    <div class="cake-wrapper">

        <div class="cake-glow"></div>

        <div class="cake">

            <div class="layer bottom"></div>
            <div class="layer middle"></div>
            <div class="layer top"></div>

           <div class="frosting">
                <div class="drip"></div>
                <div class="drip"></div>
                <div class="drip"></div>
            </div>

            

            <div class="candle">
                <div class="wick"></div>
            </div>

            <div
                class="flame"
                id="flame"
                title="Click if blowing doesn't work"
            ></div>

            <div class="smoke" id="smoke"></div>

        </div>

    </div>


    <!-- =================================================
         CONTROLS
         ================================================= -->

    <div class="controls">

        <button
            class="primary"
            id="musicButton"
        >
            ♪ Play the birthday song
        </button>

        <button
            id="micButton"
        >
            🎤 Enable microphone
        </button>

    </div>


    <p class="instruction">
        Blow into your microphone to make the wish come true
        or click the flame.
    </p>


    <!-- =================================================
         MESSAGE
         ================================================= -->

    <div
        class="message-box"
        id="messageBox"
    >
        <p class="message" id="message"></p>
        <span class="cursor"></span>
    </div>

</main>


<!-- =====================================================
     MUSIC PLAYER
     ===================================================== -->

<div
    class="music-player"
    id="musicPlayer"
>

    <div class="music-title">
        ♫ a little birthday song
    </div>

    <div class="music-progress">
        <div
            class="music-progress-bar"
            id="musicProgress"
        ></div>
    </div>

</div>


<!-- =====================================================
     FINAL MESSAGE
     ===================================================== -->

<div
    class="final"
    id="final"
>

    <div class="final-card">

        <div class="final-symbol">
            ✦
        </div>

        <h2>
            One more thing...
        </h2>

        <p id="finalMessage"></p>

        <button
            class="close-final"
            id="closeFinal"
        >
            Keep this moment ♡
        </button>

    </div>

</div>


<!-- =====================================================
     AUDIO
     ===================================================== -->

<!--
    No external music file is needed.
    The birthday song is generated by JavaScript using
    the browser's Web Audio API.
-->


<script>

/* =========================================================
   CONFIGURATION
   =========================================================

   CHANGE THESE THREE THINGS.
   ========================================================= */

const CONFIG = {

    name: "",

    message:
        "I hope this year brings you more happiness, more adventures, and more moments worth remembering.\n\nHappy birthday. ♡",

    finalMessage:
        "Whatever happens this year, I hope you know that you deserve good things, beautiful moments, and people who genuinely care about you.\n\nHappy birthday. ✦"

};


/* =========================================================
   ELEMENTS
   ========================================================= */

const flame =
    document.getElementById("flame");

const smoke =
    document.getElementById("smoke");

const messageBox =
    document.getElementById("messageBox");

const message =
    document.getElementById("message");

const final =
    document.getElementById("final");

const finalMessage =
    document.getElementById("finalMessage");

const song =
    document.getElementById("song");

const musicButton =
    document.getElementById("musicButton");

const musicPlayer =
    document.getElementById("musicPlayer");

const musicProgress =
    document.getElementById("musicProgress");

const micButton =
    document.getElementById("micButton");


/* =========================================================
   INSERT NAME
   ========================================================= */

document.getElementById("title").textContent =
    `✦Happy Birthday! ${CONFIG.name} ✦`;


/* =========================================================
   CREATE STARS
   ========================================================= */

function createStars() {

    const container =
        document.getElementById("stars");

    for (let i = 0; i < 140; i++) {

        const star =
            document.createElement("div");

        star.className = "star";

        star.style.left =
            Math.random() * 100 + "%";

        star.style.top =
            Math.random() * 100 + "%";

        const size =
            Math.random() * 2 + 1;

        star.style.width =
            size + "px";

        star.style.height =
            size + "px";

        star.style.animationDuration =
            (Math.random() * 3 + 1) + "s";

        star.style.animationDelay =
            Math.random() * 3 + "s";

        container.appendChild(star);
    }
}

createStars();


/* =========================================================
   CLASSIC HAPPY BIRTHDAY SONG
   =========================================================

   The melody below is the traditional "Happy Birthday to You"
   melody, recreated with the Web Audio API. No external audio
   file is needed.
   ========================================================= */

let musicPlaying = false;
let birthdayAudio = null;
let songTimers = [];
let songStartTime = 0;
let songDuration = 0;
let songAnimationFrame = null;

// An original little birthday melody — no external audio file needed.
// Notes are written as frequencies so it works offline in the browser.
const birthdayMelody = [
    // Happy Birthday to You
    [392.00, 0.32], // G4
    [392.00, 0.32], // G4
    [440.00, 0.64], // A4
    [392.00, 0.64], // G4
    [523.25, 0.64], // C5
    [493.88, 0.96], // B4

    // Happy Birthday to You
    [392.00, 0.32], // G4
    [392.00, 0.32], // G4
    [440.00, 0.64], // A4
    [392.00, 0.64], // G4
    [587.33, 0.64], // D5
    [523.25, 0.96], // C5

    // Happy Birthday dear...
    [392.00, 0.32], // G4
    [392.00, 0.32], // G4
    [783.99, 0.64], // G5
    [659.25, 0.64], // E5
    [523.25, 0.64], // C5
    [493.88, 0.64], // B4
    [440.00, 0.96], // A4

    // Happy Birthday to You
    [698.46, 0.32], // F5
    [698.46, 0.32], // F5
    [659.25, 0.64], // E5
    [523.25, 0.64], // C5
    [587.33, 0.64], // D5
    [523.25, 1.12]  // C5
];

const chordProgression = [
    [261.63, 329.63, 392.00], // C major
    [196.00, 246.94, 293.66], // G major
    [261.63, 329.63, 392.00], // C major
    [349.23, 440.00, 523.25], // F major
    [261.63, 329.63, 392.00]  // C major
];

function playNote(ctx, frequency, start, duration, volume = 0.12, type = "sine") {
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);

    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(volume, start + 0.025);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start(start);
    oscillator.stop(start + duration + 0.05);
}

function playBirthdaySong() {
    if (musicPlaying) {
        stopBirthdaySong();
        return;
    }

    birthdayAudio = new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

    const ctx = birthdayAudio;

    if (ctx.state === "suspended") {
        ctx.resume();
    }

    const now = ctx.currentTime + 0.08;
    songStartTime = performance.now();

    let cursor = now;
    const noteGap = 0.04;

    // Main melody
    birthdayMelody.forEach(([frequency, duration]) => {
        playNote(
            ctx,
            frequency,
            cursor,
            duration,
            0.13,
            "triangle"
        );

        cursor += duration + noteGap;
    });

    // Soft chords underneath the melody
    const chordLength = cursor - now;
    const sectionLength = chordLength / chordProgression.length;

    chordProgression.forEach((chord, index) => {
        const chordStart = now + index * sectionLength;

        chord.forEach((frequency) => {
            playNote(
                ctx,
                frequency,
                chordStart,
                sectionLength - 0.08,
                0.025,
                "sine"
            );
        });
    });

    songDuration = (cursor - now) * 1000;
    musicPlaying = true;

    musicButton.textContent = "Ⅱ Pause the birthday song";
    musicPlayer.classList.add("visible");

    updateSongProgress();

    // Start it again automatically when it finishes.
    songTimers.push(
        setTimeout(() => {
            if (musicPlaying) {
                stopBirthdaySong();
            }
        }, songDuration + 300)
    );
}

function updateSongProgress() {
    if (!musicPlaying) return;

    const elapsed = performance.now() - songStartTime;
    const progress = Math.min(100, (elapsed / songDuration) * 100);

    musicProgress.style.width = progress + "%";

    if (progress < 100) {
        songAnimationFrame = requestAnimationFrame(
            updateSongProgress
        );
    }
}

function stopBirthdaySong() {
    musicPlaying = false;

    songTimers.forEach(clearTimeout);
    songTimers = [];

    if (songAnimationFrame) {
        cancelAnimationFrame(songAnimationFrame);
        songAnimationFrame = null;
    }

    if (birthdayAudio) {
        birthdayAudio.close();
        birthdayAudio = null;
    }

    musicButton.textContent = "♪ Play the birthday song";
    musicProgress.style.width = "0%";
}

musicButton.addEventListener(
    "click",
    playBirthdaySong
);

/* =========================================================
   BLOW CANDLE
   ========================================================= */

let candleBlown = false;

function blowCandle() {

    if (candleBlown) return;

    candleBlown = true;

    flame.classList.add("off");

    smoke.classList.add("active");

    navigator.vibrate?.(100);

    createConfetti();

    createHearts();

    showMessage();

    setTimeout(
        showFinalMessage,
        5500
    );
}


/* =========================================================
   CLICK FALLBACK
   ========================================================= */

flame.addEventListener(
    "click",
    blowCandle
);


/* =========================================================
   TYPING EFFECT
   ========================================================= */

function typeText(
    element,
    text,
    speed = 35
) {

    let index = 0;

    element.textContent = "";

    function type() {

        if (index < text.length) {

            element.textContent +=
                text.charAt(index);

            index++;

            setTimeout(
                type,
                speed
            );
        }
    }

    type();
}


function showMessage() {

    messageBox.classList.add(
        "show"
    );

    typeText(
        message,
        CONFIG.message,
        32
    );
}


/* =========================================================
   FINAL MESSAGE
   ========================================================= */

function showFinalMessage() {

    finalMessage.textContent =
        "";

    final.classList.add(
        "visible"
    );

    typeText(
        finalMessage,
        CONFIG.finalMessage,
        30
    );
}


document
    .getElementById("closeFinal")
    .addEventListener(
        "click",
        () => {

            final.classList.remove(
                "visible"
            );
        }
    );


/* =========================================================
   CONFETTI
   ========================================================= */

function createConfetti() {

    const symbols = [
        "✦",
        "•",
        "◆",
        "✧"
    ];

    for (
        let i = 0;
        i < 130;
        i++
    ) {

        const piece =
            document.createElement("div");

        piece.className =
            "confetti";

        piece.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];

        const cake =
            document.querySelector(".cake");

        const cakeRect =
            cake.getBoundingClientRect();

        piece.style.left =
            (
                cakeRect.left +
                cakeRect.width / 2 +
                (Math.random() * 220 - 110)
            ) + "px";

        piece.style.top =
            (
                cakeRect.top +
                cakeRect.height * 0.35
            ) + "px";

        piece.style.color =
            [
                "#8db8ff",
                "#dceaff",
                "#ffffff",
                "#6e91c5"
            ][
                Math.floor(
                    Math.random() * 4
                )
            ];

        piece.style.setProperty(
            "--x",
            (
                Math.random() * 500 -
                250
            ) + "px"
        );

        piece.style.setProperty(
            "--duration",
            (
                Math.random() * 2 +
                2
            ) + "s"
        );

        piece.style.setProperty(
            "--rotation",
            (
                Math.random() * 1200 -
                600
            ) + "deg"
        );

        document.body.appendChild(
            piece
        );

        setTimeout(
            () => piece.remove(),
            4500
        );
    }
}


/* =========================================================
   FLOATING HEARTS
   ========================================================= */

function createHearts() {

    for (
        let i = 0;
        i < 25;
        i++
    ) {

        const heart =
            document.createElement("div");

        heart.className =
            "heart";

        heart.textContent =
            Math.random() > 0.5
                ? "♡"
                : "✦";

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.setProperty(
            "--duration",
            (
                Math.random() * 4 +
                4
            ) + "s"
        );

        heart.style.setProperty(
            "--drift",
            (
                Math.random() * 150 -
                75
            ) + "px"
        );

        heart.style.fontSize =
            (
                Math.random() * 12 +
                12
            ) + "px";

        document.body.appendChild(
            heart
        );

        setTimeout(
            () => heart.remove(),
            8000
        );
    }
}


/* =========================================================
   MICROPHONE BLOW DETECTION
   ========================================================= */

let audioContext;
let analyser;
let microphone;
let microphoneStream;
let micEnabled = false;

micButton.addEventListener(
    "click",
    enableMicrophone
);


async function enableMicrophone() {

    if (micEnabled) return;

    try {

        microphoneStream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio: true
                });

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 512;

        microphone =
            audioContext.createMediaStreamSource(
                microphoneStream
            );

        microphone.connect(
            analyser
        );

        micEnabled = true;

        micButton.textContent =
            "🎤 Microphone ready";

        detectBlow();

    } catch (error) {

        alert(
            "Your browser blocked microphone access. You can still click the candle flame."
        );
    }
}


/* =========================================================
   DETECT BLOW
   ========================================================= */

function detectBlow() {

    if (!micEnabled || candleBlown)
        return;
    requestAnimationFrame(
        detectBlow
    );
}
